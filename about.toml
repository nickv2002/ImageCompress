# cargo-about configuration. Generates THIRD_PARTY_LICENSES.html via
# scripts/collect_notices.sh. Keep `accepted` in sync with deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "IJG",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "blessing",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]
# Resolve the dependency graph for every shipped target so target-specific
# crates (macOS ImageIO bindings, musl/Linux deps) are all covered.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# Build dependencies stay included: jpegxl-src (libjxl) and similar crates
# compile C/C++ that is statically linked into the shipped binaries.
ignore-dev-dependencies = true

# --- Clarifications -------------------------------------------------------
# In-repo wrapper around Google's jpegli (BSD-3-Clause). Its Cargo.toml has no
# `license` field; the license text lives in the vendored checkout.
[jpegli-sys.clarify]
license = "BSD-3-Clause"
[[jpegli-sys.clarify.files]]
path = "vendor/jpegli/LICENSE"
checksum = "8405932022a556380c2d8c272eff154a923feb197233f348ce5f7334fb0a5ede"
license = "BSD-3-Clause"
