# cargo-deny configuration. Run: cargo deny check licenses bans sources
# Release binaries are GPL-3.0-or-later (imagequant, jpegxl-rs). GPL-2.0-only,
# AGPL-* and unlicensed crates are intentionally absent from the allow-list.

[graph]
# Check the full tree, including target-specific deps (macOS ImageIO, musl, ...).
all-features = false

[licenses]
confidence-threshold = 0.8
# Some entries are only matched by optional features or other targets (heic: LGPL/GPL-2.0+; blessing: sqlite on
# some builds), so an allowance the default tree does not use is expected, not a warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "IJG",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "blessing",
    "GPL-3.0-or-later",
    "GPL-2.0-or-later",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
]
# jpegli-sys is the in-repo wrapper around Google's jpegli (BSD-3-Clause, with
# PATENTS grant). Its Cargo.toml has no `license` field yet; clarify it here
# until `license = "BSD-3-Clause AND GPL-3.0-or-later"` is added there.
[[licenses.clarify]]
crate = "jpegli-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "vendor/jpegli/LICENSE", hash = 0 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
